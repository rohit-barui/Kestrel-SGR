name: CI

on:
  push:
    branches:
      - main
      - task/**
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=skills --cov-report=xml --cov-report=term

      - name: Enforce strict coverage limits
        run: python ci/check_coverage.py
